<!DOCTYPE html>
<html lang="en">
<head>
<!-- Internal project name: "Interview". Public name: "Stand Out at Interview". -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Stand Out at Interview | Adrian Evans</title>
<style>
  :root{
    --navy:#29245c;
    --orange:#e9761b;
    --navy-light:#3a3478;
    --navy-pale:#f0effa;
    --orange-pale:#fef4e8;
    --border:#d9d6ee;
    --muted:#6b6888;
    --ink:#1a1833;
    --rag-green:#2e9e4f;
    --rag-amber:#e0a527;
    --rag-red:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#f7f7fb;
    color:var(--ink);
  }
  header{
    background:var(--navy);
    padding:16px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header img{
    height:100px;
    width:auto;
    display:block;
    object-fit:contain;
    cursor:pointer;
  }
  #app{max-width:640px;margin:0 auto;padding:40px 24px 80px;}
  .eyebrow{font-size:13px;color:var(--orange);letter-spacing:.06em;margin:0 0 8px;text-transform:uppercase;font-weight:600;}
  h1{font-size:28px;font-weight:700;margin:0 0 14px;line-height:1.25;color:var(--navy);}
  h2{font-size:19px;font-weight:700;margin:0 0 20px;color:var(--navy);}
  p{font-size:15px;line-height:1.7;color:var(--muted);margin:0 0 16px;}
  .lead{font-size:17px;color:var(--navy);font-weight:600;margin-bottom:10px;}
  .progress{height:5px;background:var(--border);border-radius:4px;margin-bottom:24px;overflow:hidden;}
  .progress-fill{height:5px;background:var(--orange);transition:width .25s;}
  .stage-label{font-size:13px;color:var(--orange);font-weight:600;margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em;}
  input[type=email],input[type=text],input[type=date]{
    width:100%;max-width:340px;padding:11px 14px;
    border:1.5px solid var(--border);border-radius:8px;
    font-size:15px;margin-bottom:10px;font-family:inherit;
    outline:none;color:var(--ink);background:#fff;
  }
  input[type=email]:focus,input[type=text]:focus,input[type=date]:focus,textarea:focus,select:focus{border-color:var(--orange);}
  textarea{
    width:100%;min-height:104px;padding:11px 14px;
    border:1.5px solid var(--border);border-radius:8px;
    font-size:15px;line-height:1.6;font-family:inherit;color:var(--ink);background:#fff;
    outline:none;resize:vertical;display:block;
  }
  .btn{
    border:none;padding:11px 24px;border-radius:8px;font-size:14.5px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:opacity .15s;
  }
  .btn:hover{opacity:.88;}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-secondary{background:#fff;border:1.5px solid var(--border);color:var(--ink);}
  .btn.full{width:100%;margin-top:10px;}
  .btn-row{display:flex;justify-content:space-between;margin-top:28px;gap:12px;}
  .instruction{
    font-size:13px;color:var(--muted);margin:0 0 20px;
    padding:10px 14px;background:var(--navy-pale);border-left:4px solid var(--orange);
    border-radius:0 8px 8px 0;line-height:1.6;
  }
  .instruction strong{color:var(--navy);}
  .howto{background:var(--navy-pale);border-left:4px solid var(--orange);border-radius:0 10px 10px 0;padding:18px 20px;margin:24px 0 24px;}
  .howto p{font-size:14px;margin:0 0 12px;color:var(--ink);}
  .howto p:last-child{margin-bottom:0;}
  .howto-title{font-size:12px !important;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--navy) !important;}
  .howto strong{color:var(--navy);}
  .welcome{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:18px 20px;margin:0 0 6px;}
  .welcome-title{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 10px;}
  .iv-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1.5px solid var(--border);}
  .iv-row:first-of-type{border-top:none;padding-top:0;}
  .iv-name{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 2px;line-height:1.4;}
  .iv-meta{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5;}
  .iv-btns{display:flex;gap:8px;flex-shrink:0;}
  .iv-btns .btn{padding:8px 14px;font-size:13.5px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 22px;flex-wrap:wrap;}
  .toolbar select{
    font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff;
    border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;max-width:100%;outline:none;cursor:pointer;
  }
  .saved{font-size:12px;color:var(--muted);}
  .iv-context{font-size:13px;color:var(--muted);margin:-14px 0 20px;}
  .iv-context strong{color:var(--navy);}
  .q{margin-bottom:26px;}
  .q-label{display:block;font-size:14.5px;line-height:1.5;color:var(--ink);margin-bottom:8px;}
  .q-hint{font-size:13px;line-height:1.6;color:var(--muted);margin:-2px 0 10px;}
  .detail-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .detail-row label{width:150px;flex-shrink:0;font-size:14px;font-weight:600;color:var(--navy);}
  .detail-row input{flex:1;max-width:none;margin:0;}
  .step-tag{display:inline-block;background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin:10px 0 12px;}
  .guide{font-size:14.5px;color:var(--ink);line-height:1.7;margin:0 0 14px;}
  .guide strong{color:var(--navy);}
  .star-q{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:16px 18px;margin:0 0 18px;}
  .star-q-title{font-size:14.5px;line-height:1.55;color:var(--ink);margin:0 0 12px;display:flex;gap:10px;}
  .letter{
    width:26px;height:26px;border-radius:6px;background:var(--orange);color:#fff;font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .star-part{margin-bottom:10px;}
  .star-part:last-child{margin-bottom:0;}
  .star-part label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px;}
  .star-part textarea{min-height:66px;}
  .case{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:20px 22px;margin:8px 0 26px;}
  .case-title{font-size:17px;font-weight:700;color:var(--navy);margin:0 0 12px;line-height:1.35;}
  .case-title span{color:var(--orange);}
  .case p{font-size:14px;color:var(--ink);line-height:1.7;margin:0 0 12px;}
  .case p:last-child{margin-bottom:0;}
  .case-logo{float:right;width:150px;height:auto;margin:2px 0 10px 18px;}
  .signpost{background:var(--navy-pale);border-left:4px solid var(--orange);border-radius:0 10px 10px 0;padding:16px 20px;margin:0 0 16px;}
  .signpost-tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin:0 0 8px;}
  .signpost p{font-size:14px;color:var(--ink);line-height:1.7;margin:0 0 10px;}
  .signpost p:last-child{margin-bottom:0;}
  .signpost strong{color:var(--navy);}
  .kicker{text-align:center;font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--orange);margin-bottom:6px;}
  .err{color:#c0392b;font-size:13px;margin:-4px 0 12px;}
  .divider{height:1.5px;background:var(--border);margin:28px 0;}
  .legal{font-size:11px;color:var(--muted);line-height:1.5;margin:36px 0 0;text-align:center;}

  @media (max-width: 600px) {
    #app{padding:24px 18px 60px;}
    header{padding:14px 18px;}
    header img{height:56px !important;}
    h1{font-size:22px;line-height:1.3;}
    h2{font-size:17px;}
    p{font-size:14px;}
    .lead{font-size:16px;}
    .eyebrow{font-size:11px;}
    .btn{width:100%;text-align:center;padding:13px 16px;font-size:15px;}
    .btn-row{flex-direction:column-reverse;gap:10px;}
    input[type=email],input[type=text],input[type=date],textarea{max-width:100%;font-size:16px;}
    .toolbar select{width:100%;}
    .detail-row{flex-direction:column;align-items:stretch;gap:4px;}
    .detail-row label{width:auto;}
    .iv-row{flex-direction:column;align-items:stretch;}
    .iv-btns{flex-direction:column;}
    .iv-btns .btn{padding:11px 14px;}
    .stage-label{font-size:12px;}
    .divider{margin:20px 0;}
    .case{padding:16px 16px;}
    .case-logo{float:none;display:block;width:140px;margin:0 0 12px;}
    .star-q{padding:14px 14px;}
  }
</style>
</head>

// ---------- State and autosave (several interviews per device) ----------
function freshStore(){ return {interviews:{}, order:[], activeId:null, name:"", email:""}; }
function newInterview(){
  const id = "iv" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  return {id, answers:{}, lastSection:1, created:new Date().toISOString(), updated:new Date().toISOString()};
}
let store = freshStore();
let step = 0;
let storageOK = true;
let saveTimer = null;

function loadState(){
  try{
    localStorage.setItem("__tea_test", "1");
    localStorage.removeItem("__tea_test");
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ store = Object.assign(freshStore(), JSON.parse(raw)); }
  }catch(e){ storageOK = false; }
  store.order = store.order.filter(id=>store.interviews[id]);
  if(store.activeId && !store.interviews[store.activeId]) store.activeId = null;
}
function saveNow(){
  clearTimeout(saveTimer);
  const iv = active();
  if(iv) iv.updated = new Date().toISOString();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); storageOK = true; }
  catch(e){ storageOK = false; }
  updateSavedIndicator();
  refreshJumpLabels();
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
function updateSavedIndicator(){
  const el = document.getElementById("saved-ind");
  if(!el) return;
  el.textContent = storageOK ? "✓ Saved on this device" : "Saving is not available in this browser. Download your workbook to keep a copy.";
}
function active(){ return store.activeId ? store.interviews[store.activeId] : null; }
function startNewInterview(){
  const iv = newInterview();
  store.interviews[iv.id] = iv;
  store.order.unshift(iv.id);
  store.activeId = iv.id;
}

// ---------- Helpers ----------
function esc(str){
  return String(str == null ? "" : str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function nl2br(str){ return str.replace(/\r?\n/g,"<br>"); }
function plain(html){ return String(html).replace(/<[^>]+>/g,""); }
function ansOf(iv, key){ return ((iv && iv.answers[key]) || "").trim(); }
function ans(key){ return ansOf(active(), key); }
function filled(key){ return ans(key).length > 0; }
function fmtDate(v){
  if(!v) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : v;
}
function ivTitle(iv){
  const c = ansOf(iv,"interview_company"), r = ansOf(iv,"interview_role");
  if(c && r) return `${c} · ${r}`;
  return c || r || "Untitled interview";
}
function starFilled(iv, id){ return STAR_PARTS.some(p=>ansOf(iv, starKey(id,p.k))); }
function sectionProgress(s, iv){
  iv = iv || active();
  let done = 0, total = 0;
  s.blocks.forEach(b=>{
    if(b.t==="q"){ total++; if(ansOf(iv,b.key)) done++; }
    if(b.t==="details"){ total++; if(ansOf(iv,"interview_company")) done++; }
    if(b.t==="star"){ COMPETENCY.forEach(c=>{ total++; if(starFilled(iv,c.id)) done++; }); }
  });
  return {done, total};
}
function overallProgress(iv){
  let d = 0, t = 0;
  sections.forEach(s=>{ const p = sectionProgress(s, iv); d += p.done; t += p.total; });
  return {done:d, total:t};
}
function progressText(p){ return p.total ? `${p.done} of ${p.total}` : "Guidance"; }
function safeFileName(str){ return (str || "").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,""); }

// ---------- Navigation ----------
function go(n){
  step = n;
  const iv = active();
  if(iv && n >= 1 && n <= sections.length) iv.lastSection = n;
  saveNow();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function goHome(){ go(0); }

function render(){
  const id = screens[step];
  if(id==="intro" || !active()) return renderIntro();
  if(id==="send") return renderSend();
  if(id==="done") return renderDone();
  renderSection(sections.findIndex(s=>s.id===id));
}

function progressBar(){
  const pct = Math.round((step/(screens.length-1))*100);
  return `<div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>`;
}
function legalHTML(){ return `<p class="legal">${esc(LEGAL)}</p>`; }

  }

function toolbarHTML(idx){

function refreshJumpLabels(){

function renderSection(idx){
  const s = sections[idx];
  let html = progressBar() + toolbarHTML(idx);
  html += `<p class="stage-label">Section ${idx+1} of ${sections.length}</p>`;

    html += `<p class="iv-context">Preparing for: <strong>${esc(ivTitle(active()))}</strong></p>`;
  }
  s.blocks.forEach(b=>{
    if(b.t==="details") html += detailsHTML();
    if(b.t==="step") html += `<div><span class="step-tag">Step ${b.n}</span></div>`;
    if(b.t==="p") html += `<p class="guide">${b.html}</p>`;
    if(b.t==="q") html += qHTML(b);
    if(b.t==="star") html += starHTML();
    if(b.t==="case") html += caseHTML(b);
    if(b.t==="signposts") html += signpostsHTML();
  });
  html += `<div class="btn-row">`;
  html += `<button class="btn btn-secondary" id="back-btn">&larr; Back</button>`;
  html += `<button class="btn btn-primary" id="next-btn">${idx===sections.length-1 ? "Finish" : "Continue"} &rarr;</button>`;
  html += `</div>`;
  html += legalHTML();
  root.innerHTML = html;

  root.querySelectorAll("[data-key]").forEach(el=>{

}

// ---------- PDF (completed workbook and blank printable version) ----------
async function downloadPDF(btn, blank){
  const original = btn.textContent;
  btn.textContent = "Preparing PDF...";
  btn.disabled = true;
  try{
    const doc = await buildWorkbookPDF(blank);
    doc.save(blank ? "Stand-Out-at-Interview-Printable-Workbook.pdf" : pdfFileName());
  }catch(err){
    alert("Sorry, the PDF could not be generated. Please try again.");
  }finally{
    btn.textContent = original;
    btn.disabled = false;
  }
}
function pdfFileName(){
  const parts = [safeFileName(store.name), safeFileName(ans("interview_company"))].filter(Boolean);
  return (parts.length ? parts.join("-") + "-" : "") + "Stand-Out-at-Interview.pdf";
}
async function loadImageAspect(src){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=> resolve(img.width / img.height);
    img.onerror = ()=> resolve(1900/1085);
    img.src = src;
  });
}

async function buildWorkbookPDF(blank){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const M = 14, CW = pageW - 2*M;
  const navy = "#29245c", orange = "#e9761b", muted = "#6b6888", ink = "#1a1833", border = "#d9d6ee";
  let y = 0;

  const ensure = h => { if(y + h > pageH - 16){ doc.addPage(); y = 20; } };
  const font = (size, style, color) => { doc.setFontSize(size); doc.setFont("helvetica", style || "normal"); doc.setTextColor(color || ink); };
  const lineH = size => size * 0.3528 * 1.45;
  const para = (str, size, style, color, x, w) => {
    font(size, style, color);
    const lines = doc.splitTextToSize(String(str), w || CW);
    const h = lineH(size);
    lines.forEach(l => { ensure(h); doc.text(l, x || M, y + h * 0.72); y += h; });
  };
  const heading = (name, need) => {
    ensure(Math.max(22, need || 0));
    y += 3;
    font(15, "bold", navy);
    doc.text(name, M, y + 5);
    y += 8;
    doc.setDrawColor(orange); doc.setLineWidth(0.9);
    doc.line(M, y, M + 38, y);
    doc.setLineWidth(0.2);
    y += 7;
  };
  const stepTag = n => {
    ensure(blank ? 30 : 16);
    doc.setFillColor(navy);
    doc.roundedRect(M, y, 17, 5.5, 1, 1, "F");
    font(7.5, "bold", "#ffffff");
    doc.text(`STEP ${n}`, M + 8.5, y + 3.8, { align:"center", charSpace:0.3 });
    y += 9;
  };
  const box = h => {
    ensure(h);
    doc.setDrawColor(border); doc.setLineWidth(0.3);
    doc.rect(M, y, CW, h);
    doc.setLineWidth(0.2);
    y += h + 7;
  };
  const qa = (label, val, boxH) => {
    ensure(blank ? 12 + (boxH || 30) : 14);
    para(label, 10, "bold", ink);
    y += 1.5;
    if(blank){ box(boxH || 30); return; }
    if(val) para(val, 10, "normal", ink);
    else para("No answer yet", 10, "italic", muted);
    y += 5;
  };

  // Header band with logo (page 1)
  const logoSrc = document.querySelector("header img").src;
  const aspect = await loadImageAspect(logoSrc);
  doc.setFillColor(navy);
  doc.rect(0, 0, pageW, 28, "F");
  try{ doc.addImage(logoSrc, "PNG", M, 7, 14 * aspect, 14); }catch(e){}
  font(11, "bold", "#ffffff");
  doc.text("Stand Out at Interview", pageW - M, 16, { align:"right" });

  y = 40;
  font(10, "bold", orange);
  doc.text("STAND OUT AT INTERVIEW", pageW / 2, y, { align:"center", charSpace:0.5 });
  y += 10;
  font(20, "bold", navy);
  doc.text(blank ? "Your Printable Workbook" : "Your Interview Preparation", pageW / 2, y, { align:"center" });
  y += 8;
  font(10.5, "normal", muted);
  doc.text("Preparation, deliberate practice and overcoming adversity.", pageW / 2, y, { align:"center" });
  y += 10;

  font(9.5, "normal", muted);
  if(blank){
    doc.text("Name:", M, y); doc.setDrawColor(border); doc.line(M + 12, y + 0.5, M + 90, y + 0.5);
    doc.text("Date:", pageW - M - 60, y); doc.line(pageW - M - 49, y + 0.5, pageW - M, y + 0.5);
  } else {
    doc.text(`Executive: ${store.name || ""}`, M, y);
    doc.text(`Date: ${new Date().toLocaleDateString("en-GB")}`, pageW - M, y, { align:"right" });
  }
  y += 6;
  doc.setDrawColor(border);
  doc.line(M, y, pageW - M, y);
  y += 8;

  // Interview details
  if(blank){
    DETAILS.forEach(d=>{
      font(10, "bold", navy); doc.text(d.label + ":", M, y + 4);
      doc.setDrawColor(border); doc.line(M + 34, y + 4.5, pageW - M, y + 4.5);
      y += 10;
    });
    y += 2;
    para("Complete one workbook for each interview. Work through the 13 steps in order, then transfer your answers into the online workbook so they are saved and can be shared with Adrian.", 9.5, "normal", ink);
    y += 4;
  } else {
    ensure(34);
    doc.setFillColor("#f0effa");
    doc.roundedRect(M, y, CW, 30, 3, 3, "F");
    let yy = y + 7;
    DETAILS.forEach(d=>{
      font(9, "bold", navy); doc.text(d.label.toUpperCase(), M + 5, yy);
      const v = d.type==="date" ? fmtDate(ans(d.key)) : ans(d.key);
      font(10, v ? "bold" : "italic", v ? ink : muted);
      doc.text(doc.splitTextToSize(v || "Not added", CW - 52)[0], M + 45, yy);
      yy += 6;
    });
    y += 36;
  }

  sections.forEach(s => {
    if(s.id === "action"){
      heading(s.name, 70);
      para("Major rethink! Stand out at interview by preparing like never before.", 10, "bold", ink);
      y += 3;
      SIGNPOSTS.forEach((ps,i) => {
        ensure(24);
        font(9, "bold", orange); doc.text(`SIGNPOST ${i+1}`, M, y + 3); y += 6;
        ps.forEach(p => { para(plain(p), 9.5, "normal", ink); y += 1.5; });
        y += 3;
      });
      return;
    }
    heading(s.name, blank ? 70 : 40);
    s.blocks.forEach(b => {
      if(b.t==="step" && blank) stepTag(b.n);
      if(b.t==="p" && blank){ para(plain(b.html), 9.5, "normal", ink); y += 2; }
      if(b.t==="q"){
        if(blank && b.hint){ ensure(48); para(b.label, 10, "bold", ink); y += 1; para(b.hint, 9, "italic", muted); y += 1.5; box(30); }
        else qa(b.label, ans(b.key), b.key==="step12_thank_you" ? 44 : 30);
      }
      if(b.t==="star"){
        if(blank){
          para("A great tool which provides the appropriate structure for this style of interview question is the STAR framework: Situation, Task, Action and Result.", 9.5, "normal", ink);
          y += 2;
          STAR_PARTS.forEach(p => { para(`${p.name}: ${p.desc}`, 9.5, "normal", ink, M + 4, CW - 4); y += 1; });
          y += 4;
        }
        COMPETENCY.forEach(c => {
          ensure(blank ? 90 : 20);
          para(`${c.id}.  ${c.text}`, 10, "bold", ink);
          y += 2;
          if(blank){
            STAR_PARTS.forEach(p => {
              ensure(24);
              font(8.5, "bold", navy); doc.text(p.name.toUpperCase(), M, y + 3); y += 5;
              box(14);
            });
            return;
          }
          if(!starFilled(active(), c.id)){ para("No answer yet", 10, "italic", muted); y += 5; return; }
          STAR_PARTS.forEach(p => {
            const v = ans(starKey(c.id, p.k));
            ensure(10);
            font(8.5, "bold", navy); doc.text(p.name.toUpperCase(), M + 2, y + 3); y += 5;
            if(v) para(v, 10, "normal", ink, M + 2, CW - 2); else para("No answer yet", 10, "italic", muted, M + 2, CW - 2);
            y += 2;
          });
          y += 4;
        });
      }
    });
  });

  if(!blank){
    y += 2;
    ensure(26);
    doc.setDrawColor(border);
    doc.line(M, y, pageW - M, y);
    y += 8;
    font(10, "bold", navy); doc.text("Adrian Evans", M, y); y += 5;
    font(10, "normal", muted); doc.text("The Executive Advantage", M, y); y += 5;
    doc.text("adrian@adrianevans.co.uk", M, y); y += 8;
  }
  y += 4;
  ensure(17);
  para(LEGAL, 7, "normal", muted);
  return doc;
}

// ---------- Results email (sent via Zapier as email_html) ----------
function buildEmailHTML(){
  const navy = "#29245c", orange = "#e9761b", muted = "#6b6888", ink = "#1a1833", border = "#d9d6ee";
  // Short font stack keeps email_html compact (oversized fields cannot be mapped in Zapier).
  const font = "font-family:Helvetica,Arial,sans-serif;";
  const todayStr = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric'});
  const answerP = val => val
    ? `<p style="${font}font-size:14px;color:${ink};margin:0;line-height:1.6;">${nl2br(esc(val))}</p>`
    : `<p style="${font}font-size:14px;color:${muted};margin:0;line-height:1.6;font-style:italic;">No answer yet</p>`;
  const qRow = (label, val) => `
    <tr><td style="padding:0 0 16px;">
      <p style="${font}font-size:13px;font-weight:700;color:${ink};margin:0 0 4px;line-height:1.4;">${esc(label)}</p>
      ${answerP(val)}
    </td></tr>`;
  const secHead = name => `
    <tr><td style="padding:18px 0 12px;">
      <p style="${font}font-size:17px;font-weight:700;color:${navy};margin:0 0 6px;">${esc(name)}</p>
      <table role="presentation" width="44" cellpadding="0" cellspacing="0"><tr><td style="background:${orange};height:3px;font-size:1px;line-height:3px;">&nbsp;</td></tr></table>
    </td></tr>`;

  let rows = "";
  sections.forEach(s => {
    const answerBlocks = s.blocks.filter(b=>b.t==="q" || b.t==="star");
    if(!answerBlocks.length) return;
    rows += secHead(s.name);
    answerBlocks.forEach(b => {
      if(b.t==="q"){ rows += qRow(b.label, ans(b.key)); return; }
      COMPETENCY.forEach(c => {
        let inner;
        if(!starFilled(active(), c.id)){
          inner = answerP("");
        } else {
          inner = `<table role="presentation" width="100%" cellpadding="0" cellspacing="0">` + STAR_PARTS.map(p => {
            const v = ans(starKey(c.id, p.k));
            return `<tr>
              <td width="84" valign="top" style="${font}font-size:12px;font-weight:700;color:${navy};padding:3px 8px 3px 0;width:84px;">${p.name}</td>

          }).join("") + `</table>`;
        }
        rows += `<tr><td style="padding:0 0 16px;">
          <p style="${font}font-size:13px;font-weight:700;color:${ink};margin:0 0 6px;line-height:1.4;"><span style="color:${orange};">${c.id}.</span> ${esc(c.text)}</p>
          ${inner}
        </td></tr>`;
      });
    });
  });

  const detailRows = DETAILS.map(d => {
    const v = d.type==="date" ? fmtDate(ans(d.key)) : ans(d.key);
    return `<tr>
      <td width="120" valign="top" style="${font}font-size:12px;font-weight:800;letter-spacing:.5px;color:${navy};padding:3px 8px 3px 0;width:120px;">${d.label.toUpperCase()}</td>

  }).join("");

  return `<!DOCTYPE html>

    </tr></table>

    <p style="${font}font-size:12px;font-weight:700;letter-spacing:1.5px;color:${orange};margin:0;">STAND OUT AT INTERVIEW</p>
    <p style="${font}font-size:22px;font-weight:700;color:${navy};margin:8px 0 4px;">Your Interview Preparation</p>
    <p style="${font}font-size:13.5px;color:${muted};margin:0 0 16px;">Preparation, deliberate practice and overcoming adversity.</p>
  </td></tr>
  <tr><td style="padding:0 28px 8px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
      <td style="${font}font-size:13px;color:${muted};">Executive: ${esc(store.name)}</td>
      <td align="right" style="${font}font-size:13px;color:${muted};">Date: ${todayStr}</td>
    </tr></table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f0effa;border-radius:10px;"><tr><td style="padding:12px 16px;">

  <tr><td style="padding:4px 28px 0;">

// ---------- Submission to Zapier ----------
function buildPayload(){
  const p = { timestamp: new Date().toISOString(), name: store.name, email: store.email };
  DETAILS.forEach(d => { p[d.key] = d.type==="date" ? fmtDate(ans(d.key)) : ans(d.key); });
  sections.forEach(s => s.blocks.forEach(b => {
    if(b.t==="q") p[b.key] = ans(b.key);
    if(b.t==="star") COMPETENCY.forEach(c => STAR_PARTS.forEach(sp => { p[starKey(c.id, sp.k)] = ans(starKey(c.id, sp.k)); }));
  }));
  return p;
}

async function submitWorkbook(){
  const setStatus = t => { const el = document.getElementById("submit-status"); if(el) el.textContent = t; };
  if(!WEBHOOK_URL || WEBHOOK_URL.startsWith("REPLACE_WITH")){
    setStatus("Please download your workbook below and email it to adrian@adrianevans.co.uk.");
    return;
  }
  const payload = buildPayload();
  try{
    const doc = await buildWorkbookPDF(false);
    payload.pdf_base64 = (doc.output("datauristring").split(",")[1]) || "";
    payload.pdf_filename = pdfFileName();
  }catch(err){
    payload.pdf_base64 = "";
    payload.pdf_filename = "";
  }
  try{ payload.email_html = buildEmailHTML(); }catch(err){ payload.email_html = ""; }
  try{
    await fetch(WEBHOOK_URL, {
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    setStatus("Your workbook has been sent to Adrian, and a copy is on its way to your inbox.");
  }catch(err){
    setStatus("Your workbook could not be sent just now. Please download it below and email it to adrian@adrianevans.co.uk.");
  }
}

loadState();
render();
</script>
